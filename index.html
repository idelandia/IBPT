        <p><strong>Estadual:</strong> <span id="res-est" class="val"></span></p>

            document.getElementById("res-desc").innerText = info.desc;
            document.getElementById("res-tab").innerText = info.tabela;
            
            document.getElementById("res-fed-nac").innerText = info.federalNac.toFixed(2).replace('.', ',') + " %";
            document.getElementById("res-fed-imp").innerText = info.federalImp.toFixed(2).replace('.', ',') + " %";

            document.getElementById("res-mun").innerText = info.municipal.toFixed(2).replace('.', ',') + " %";
            
            painelResultado.style.display = "block";

            alert("Código de serviço não localizado na base.");
